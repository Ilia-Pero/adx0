name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  program:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --bundles nsis
          - os: macos-latest
            args: --target universal-apple-darwin --bundles app,dmg
          - os: ubuntu-24.04
            args: --bundles deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
      - name: Targets of macOS
        if: runner.os == 'macOS'
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin
      - name: Libraries of Ubuntu
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Linters and tests
        run: npm run build
      - name: Installer
        run: npm run tauri build -- ${{ matrix.args }}
      - name: Installing on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory installers
          $file = Copy-Item src-tauri/target/release/bundle/nsis/*-setup.exe installers/adx0-windows.exe -PassThru
          $folder = "$env:ProgramFiles\adx0"
          $setup = Start-Process $file.FullName '/S' -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "The installer has failed: $($setup.ExitCode)" }
          $program = Start-Process "$folder\adx0.exe" -PassThru
          if ($program.WaitForExit(10000)) { throw "The program has ended: $($program.ExitCode)" }
          $program.Kill()
          $program.WaitForExit()
          $home_ = New-Item -ItemType Directory "$env:RUNNER_TEMP\choice"
          '{"sources":["yoyo"],"blocked":["ads.example.com"],"allowed":[],"language":"en","fresh":true}' | Set-Content "$home_\settings.json"
          $hosts = "$env:SystemRoot\System32\drivers\etc\hosts"
          foreach ($words in @('--apply', "`"$home_`""), @('--refresh')) {
            $done = Start-Process "$folder\adx0.exe" $words -Wait -PassThru
            if ($done.ExitCode -ne 0) { throw "$words has failed: $($done.ExitCode)" }
            if (-not (Select-String -Quiet 'ads.example.com' $hosts)) { throw "Nothing is blocked after $words" }
          }
          $task = schtasks /Query /TN adx0 /XML
          if ($LASTEXITCODE -ne 0) { throw 'The system does not start the program by itself' }
          $task
          foreach ($part in '<UserId>S-1-5-18</UserId>', '<DisallowStartIfOnBatteries>false', "<Command>`"$folder\adx0.exe`"</Command>") {
            if (-not ("$task".Contains($part))) { throw "There is no $part in the task" }
          }
          if (Test-Path "$folder\kept\task.xml") { throw 'The task is still in the folder' }
          Start-Process "$folder\uninstall.exe" '/S', "_?=$folder" -Wait
          if (Test-Path "$folder\adx0.exe") { throw 'The program is still there' }
          if (Select-String -Quiet 'ads.example.com' $hosts) { throw 'The address is still blocked' }
          if (Test-Path "$folder\kept") { throw 'The lists are still there' }
          schtasks /Query /TN adx0
          if ($LASTEXITCODE -eq 0) { throw 'The system still starts the program' }
          $global:LASTEXITCODE = 0
      - name: Installing on macOS
        if: runner.os == 'macOS'
        run: |
          mkdir installers
          cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg installers/adx0-macos.dmg
          disk="$RUNNER_TEMP/disk"
          app='/Applications/adx0.app'
          program="$app/Contents/MacOS/adx0"
          hdiutil attach -nobrowse -mountpoint "$disk" installers/adx0-macos.dmg
          cp -R "$disk/adx0.app" /Applications
          hdiutil detach "$disk"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --display --verbose=2 --entitlements - "$app"
          lipo "$program" -verify_arch x86_64 arm64
          vtool -arch x86_64 -show-build "$program" | grep -E '(minos|version) +10\.13'
          "$program" &
          sleep 10
          kill $!
          mkdir "$RUNNER_TEMP/choice"
          echo '{"sources":["yoyo"],"blocked":["ads.example.com"],"allowed":[],"language":"en","fresh":true}' > "$RUNNER_TEMP/choice/settings.json"
          sudo "$program" --apply "$RUNNER_TEMP/choice"
          grep ads.example.com /etc/hosts
          sudo launchctl print system/io.github.ilia-pero.adx0 | head -5
          sudo '/Library/Application Support/adx0/adx0' --refresh
          grep ads.example.com /etc/hosts
          sudo "$program" --clear
          if grep ads.example.com /etc/hosts; then exit 1; fi
          if sudo launchctl print system/io.github.ilia-pero.adx0; then exit 1; fi
          test ! -e '/Library/Application Support/adx0'
      - name: Installing on Ubuntu
        if: runner.os == 'Linux'
        run: |
          mkdir installers
          cp src-tauri/target/release/bundle/deb/*.deb installers/adx0-ubuntu.deb
          for system in ubuntu:24.04 ubuntu:26.04; do
            docker run --rm -v "$PWD/installers:/installers:ro" "$system" bash -c '
              set -e
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq
              apt-get install -qq -y /installers/adx0-ubuntu.deb
              apt-get install -qq -y xvfb xauth dbus-daemon
              status=0
              xvfb-run -a dbus-run-session -- timeout 10 adx0 || status=$?
              test "$status" -eq 124'
          done
          sudo apt-get install -qq -y ./installers/adx0-ubuntu.deb
          mkdir "$RUNNER_TEMP/choice"
          echo '{"sources":["yoyo"],"blocked":["ads.example.com"],"allowed":[],"language":"en","fresh":true}' > "$RUNNER_TEMP/choice/settings.json"
          sudo adx0 --apply "$RUNNER_TEMP/choice"
          grep ads.example.com /etc/hosts
          systemctl is-enabled adx0.timer
          sudo systemctl start adx0.service
          sudo adx0 --refresh
          grep ads.example.com /etc/hosts
          sudo apt-get remove -qq -y adx0
          if grep ads.example.com /etc/hosts; then exit 1; fi
          if systemctl is-enabled adx0.timer; then exit 1; fi
          test ! -e /var/lib/adx0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-${{ runner.os }}
          path: installers/
          if-no-files-found: error
  extension:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: The file for Firefox
        run: |
          for browser in firefox chrome; do
            (cd "packed/$browser" && zip -qr "../../adx0-$browser.zip" .)
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extension
          path: extension/adx0-*.zip
          if-no-files-found: error
