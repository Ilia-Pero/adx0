[package]
name = "adx0-system"
version = "0.1.0"
edition = "2021"
description = "What the program needs from the operating system"
license = "MIT"
publish = false

[dependencies]
adx0-core = { path = "../core" }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true
